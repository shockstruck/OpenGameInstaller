<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />

    <title>OpenGameInstaller</title>

    <link rel="icon" type="image/png" href="/favicon.png" />
    <script>
      (function () {
        // Mirrors resolveTheme() in src/frontend/lib/theme.ts; this bootstrap
        // script runs before any module import is possible, so it can't
        // import the resolver itself.
        var theme = 'light';
        try {
          if (
            typeof window !== 'undefined' &&
            window.electronAPI &&
            typeof window.electronAPI.getTheme === 'function'
          ) {
            theme = window.electronAPI.getTheme();
            if (
              (theme === 'system' ||
                (theme !== 'light' && theme !== 'dark' && theme !== 'synthwave')) &&
              typeof window.electronAPI.getSystemColorScheme === 'function'
            ) {
              theme = window.electronAPI.getSystemColorScheme();
            }
          }
        } catch (e) {}
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
  </head>

  <body>
    <script type="module" src="/src/frontend/main.ts"></script>
  </body>
</html>
