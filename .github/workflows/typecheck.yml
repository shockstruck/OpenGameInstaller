# Unified typecheck workflow matching Flex pattern
name: Typecheck

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1'

      - name: Cache dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.bun/install/cache
            node_modules
            application/node_modules
            packages/*/node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lockb', '**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run typecheck
        id: typecheck
        continue-on-error: true
        run: |
          set -o pipefail
          bun run typecheck 2>&1 | tee typecheck-output.txt

      - name: Extract errors
        if: always()
        id: errors
        run: |
          # Always create errors.txt (even if empty)
          touch errors.txt

          if [ -f typecheck-output.txt ]; then
            # Improved regex to catch actual errors but ignore "0 errors"
            ERROR_REGEX='found [1-9][0-9]* error|error TS[0-9]+:|Error:'
            # Strip ANSI escape codes and extract error lines
            sed -r "s/\x1B\[([0-9]{1,3}(;[0-9]{1,2})?)?[mGK]//g" typecheck-output.txt | grep -iE "$ERROR_REGEX" > errors.txt || true
            
            # Check if we found any errors
            if [ -s errors.txt ]; then
              echo "has_errors=true" >> $GITHUB_OUTPUT
            else
              echo "has_errors=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "has_errors=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload typecheck results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: typecheck-results
          path: errors.txt
          if-no-files-found: ignore

      - name: Fail if typecheck failed
        if: steps.typecheck.outcome == 'failure'
        run: exit 1

  updater:
    name: Updater (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1'
      - run: bun install --frozen-lockfile
        env:
          # Updater build/tests never launch Electron; the binary download is flaky on Windows runners.
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      - run: bun run --cwd updater build
      - run: bun run --cwd updater test
